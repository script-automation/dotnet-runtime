name: Build for 8.0

on:
  schedule:
    - cron: '0 4,16 * * *'
  push:
    branches:
      - main

env:
  VERSION: '8.0'
  DH_IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/dotnet-runtime

jobs:

  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Login Registry
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.${{env.VERSION}}
          push: true
          platforms: |
            linux/amd64
          tags: |
            ${{ env.DH_IMAGE_NAME }}:${{ env.VERSION }}
